[package]
name = "glyph"
version = "26.1.0-pre.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pumpkin-plugin-api = "0.2.0"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true

[features]
default = ["plugin"]
plugin = []